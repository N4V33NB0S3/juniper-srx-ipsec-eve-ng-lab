! Cisco IOSv/IOS-L3 ISP router — exact guide configuration
enable
configure terminal
hostname ISP-RTR
ip routing
!
interface GigabitEthernet0/0
 description To-SRX1
 ip address 203.0.113.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description To-SRX2
 ip address 203.0.114.1 255.255.255.252
 no shutdown
!
end
write memory
